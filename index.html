  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #283149;
      font-family: 'Arvo', serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Pink letter with white/3D shadow text styling */
    .drum-letter {
      font-family: 'Arvo', serif;
      color: #DA0463;
      text-shadow: 3px 3px 0px #ffffff, 5px 5px 0px rgba(0,0,0,0.15);
    }

    .title-text {
      font-family: 'Arvo', serif;
      color: #DBEDF3;
      text-shadow: 3px 3px 0px #DA0463;
    }

    /* Card hover & active animations */
    .drum-card {
      background-color: #ffffff;
      border: 10px solid #404B69;
      border-radius: 28px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .drum-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.4);
    }

    .drum-card:active, .drum-card.pressed {
      transform: scale(0.92);
      border-color: #DA0463;
      box-shadow: 0 2px 10px rgba(218, 4, 99, 0.6);
    }

    /* Key indicator overlay */
    .key-badge {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>

  <!-- Audio Synthesis & Interaction Logic Script -->
  <script>
    // Initialize Web Audio Context dynamically on user interaction
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Helper: Create White Noise Buffer for Snares & Cymbals
    let noiseBuffer = null;
    function getNoiseBuffer(ctx) {
      if (!noiseBuffer) {
        const bufferSize = ctx.sampleRate * 2; // 2 seconds of noise
        noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
      }
      return noiseBuffer;
    }

    // Dynamic Sound Synthesizers for 100% reliable offline sound playback
    const soundSynthesizers = {
      // 'w': Tom 1 (High Pitch Tom)
      w: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);

        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      },

      // 'a': Tom 2 (Mid-High Pitch Tom)
      a: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.4);

        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      },

      // 's': Tom 3 (Mid-Low Pitch Tom)
      s: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.45);

        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.45);
      },

      // 'd': Tom 4 (Floor Tom - Deep Low Pitch)
      d: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.5);

        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
      },

      // 'j': Snare Drum (Triangle Body Tone + High Pass Noise Snap)
      j: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Snare Tone Body
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
        oscGain.gain.setValueAtTime(0.7, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);

        // Snare White Noise Snap
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = getNoiseBuffer(ctx);
        
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1000, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.8, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        noiseSource.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
        noiseSource.start(now);
        noiseSource.stop(now + 0.2);
      },

      // 'k': Cymbal / Hi-Hat (Metallic High Pass Noise Splash)
      k: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = getNoiseBuffer(ctx);

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(5000, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noiseSource.start(now);
        noiseSource.stop(now + 0.35);
      },

      // 'l': Bass / Kick Drum (Deep Low Sub Sine Drop)
      l: function() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

        gain.gain.setValueAtTime(1.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      }
    };

    // Play Sound & Trigger UI Press Effect
    function playDrum(key) {
      const lowerKey = key.toLowerCase();
      if (soundSynthesizers[lowerKey]) {
        soundSynthesizers[lowerKey]();

        // Visual animation on matching button
        const button = document.querySelector(`.drum-card[data-key="${lowerKey}"]`);
        if (button) {
          button.classList.add('pressed');
          setTimeout(() => {
            button.classList.remove('pressed');
          }, 100);
        }
      }
    }

    // Event Listeners for Mouse/Touch Clicks
    const drumButtons = document.querySelectorAll('.drum-card');
    drumButtons.forEach(button => {
      const key = button.getAttribute('data-key');
      
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playDrum(key);
      });
    });

    // Keyboard Event Listener
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return; // avoid duplicate fires on holding key down
      playDrum(e.key);
    });

    // Fun Header Emoji Click Effect
    document.getElementById('headerEmoji').addEventListener('click', () => {
      // Play a quick drum roll!
      const keys = ['l', 'j', 'w', 'a', 's', 'd', 'k'];
      keys.forEach((k, i) => {
        setTimeout(() => playDrum(k), i * 80);
      });
    });
  </script>
</body>
</html>
